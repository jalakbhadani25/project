<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Question for You...</title>
    <style>
        /* --- CSS STYLES (Making it look pretty) --- */
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fce4ec; /* Starts with a cute pink background */
            transition: background 1s ease; /* Smooth transition when image loads */
        }

        /* The Box Container */
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 80%;
        }

        /* Inputs and Buttons */
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 70%;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
        }

        h1 { color: #d81b60; }
        
        #error-message { color: red; display: none; margin-top: 10px; }

        /* Button Colors */
        .enter-btn { background-color: #d81b60; color: white; }
        #yesBtn { background-color: #4CAF50; color: white; }
        #noBtn { background-color: #f44336; color: white; position: absolute; }

        /* Hide the proposal screen initially */
        #proposal-screen { display: none; }

    </style>
</head>
<body>

    <div id="login-screen" class="container">
        <h1>🔒 Top Secret 🔒</h1>
        <p>I have a question, but first...<br>What is the secret password?</p>
	<h6>HINT: Password in lowercase only</h6>
        <input type="text" id="passwordInput" placeholder="Type here...">
        <br>
        <button class="enter-btn" onclick="checkPassword()">Unlock</button>
        <p id="error-message">Wrong password! Try again.</p>
    </div>

    <div id="proposal-screen" class="container">
        <h1>Will you be my forever? ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="saidYes()">YES!</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <script>
        // --- JAVASCRIPT LOGIC (The Brains) ---

        function checkPassword() {
            const password = document.getElementById("passwordInput").value;
            const loginScreen = document.getElementById("login-screen");
            const proposalScreen = document.getElementById("proposal-screen");
            const errorMessage = document.getElementById("error-message");

            // CHANGE "Forever" BELOW TO YOUR ACTUAL PASSWORD
            if (password.toLowerCase() === "meet") {
                
                // 1. Hide Login Screen
                loginScreen.style.display = "none";
                
                // 2. Show Proposal Screen
                proposalScreen.style.display = "block";

                // 3. Change Background to your Image
		document.body.style.backgroundImage = "url('bg1.jpg')"; // Make sure this matches your filename exactly!
		document.body.style.backgroundSize = "cover";
                document.body.style.backgroundPosition = "center";
                document.body.style.backgroundRepeat = "no-repeat";

            } else {
                errorMessage.style.display = "block";
            }
        }

        function moveButton() {
            const noBtn = document.getElementById("noBtn");
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }

        function saidYes() {
            // You can customize this message!
            alert("YAY! I love you! ❤️ You made me the happiest person!");
        }
    </script>

</body>

</html>
